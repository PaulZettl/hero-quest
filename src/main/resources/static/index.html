<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hero-screen">
    <h1>Hero Selection</h1>
    <div id="hero-container"></div>
</div>

<button command="show-modal" commandfor="createDialog">Create Hero</button>
<dialog id="createDialog">
    <h2>Create new Hero</h2>
    <form id="creationForm">
        <input type="text" id="heroName" placeholder="Enter name">
        <input type="number" id="strengthScore">
        <input type="number" id="constitutionScore">
        <input type="number" id="speedScore">
        <input type="submit" value="Confirm">
        <button command="close" commandfor="createDialog" type="button">Cancel</button>
    </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
